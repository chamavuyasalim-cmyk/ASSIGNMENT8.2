<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="An auto-responsive photo gallery built using HTML and CSS Grid.">
    <title>Assignment 8.2 - Responsive Image Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="page-header">
        <h1>My Photo Gallery</h1>
        <p>
            A responsive image gallery built with HTML and CSS Grid.
            Resize your browser to see the layout adjust automatically.
        </p>
    </header>

    <main class="gallery-container">
        <section class="gallery" aria-label="Photo gallery">

            <figure class="gallery-item">
                <img src="IMAGES/5.5 INSPECT.png" alt="Mountain landscape" loading="lazy">
                <figcaption>Mountain Views</figcaption>
            </figure>

            <figure class="gallery-item">
                <img src="IMAGES/5.5 WEB PAGE.png" alt="Ocean and beach" loading="lazy">
                <figcaption>Ocean Breeze</figcaption>
            </figure>

            <figure class="gallery-item">
                <img src="IMAGES/6.1 BOX MODEL.png" alt="Green forest" loading="lazy">
                <figcaption>Green Forest</figcaption>
            </figure>

            <figure class="gallery-item">
                <img src="IMAGES/6.1 CSS BOX.png" alt="Sunset in the sky" loading="lazy">
                <figcaption>Golden Sunset</figcaption>
            </figure>

            <figure class="gallery-item">
                <img src="IMAGES/6.1 DEV TOOLS INSPECT.png" alt="Flowers in a garden" loading="lazy">
                <figcaption>Flower Garden</figcaption>
            </figure>

            <figure class="gallery-item">
                <img src="IMAGES/6.2 BLOCK...png" alt="Snow-covered mountains" loading="lazy">
                <figcaption>Winter Escape</figcaption>
            </figure>

            <figure class="gallery-item">
                <img src="IMAGES/6.2 CSS STYLING PAGE.png" alt="City buildings" loading="lazy">
                <figcaption>City Life</figcaption>
            </figure>

            <figure class="gallery-item">
                <img src="IMAGES/6.3 OVERFLOW3.png" alt="Quiet countryside" loading="lazy">
                <figcaption>Open Countryside</figcaption>
            </figure>
             <figure class="gallery-item">
                <img src="IMAGES/6.4 POSITIONING.png" alt="Quiet countryside" loading="lazy">
                <figcaption>Open Countryside</figcaption>
            </figure>
             <figure class="gallery-item">
                <img src="IMAGES/6.4POSITIONING2.png" alt="Quiet countryside" loading="lazy">
                <figcaption>Open Countryside</figcaption>
            </figure>
             <figure class="gallery-item">
                <img src="IMAGES/6.4POSITIONING4.png" alt="Quiet countryside" loading="lazy">
                <figcaption>Open Countryside</figcaption>
            </figure>

        </section>
    </main>

    <footer class="page-footer">
        <p>Assignment 8.2 — Auto-Responsive Image Gallery</p>
    </footer>

</body>
</html>
